name: Android Release Build

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.1.7)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # The action's historical default also requests the retired `tools` SDK
      # package, which makes current GitHub-hosted runners fail before build.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$TAG_VERSION}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 0.1.7; got: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install Android native build tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.3.11579264"
      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          CPRINT_RELEASE_STORE_PASSWORD: ${{ secrets.CPRINT_RELEASE_STORE_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$CPRINT_RELEASE_STORE_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          RELEASE_KEY_ALIAS="$(keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$CPRINT_RELEASE_STORE_PASSWORD" 2>/dev/null | sed -n 's/^\([^,]*\),.*/\1/p' | head -n 1)"
          test -n "$RELEASE_KEY_ALIAS"
          {
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "CPRINT_RELEASE_STORE_PASSWORD=$CPRINT_RELEASE_STORE_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon -PreleaseVersion="${{ steps.version.outputs.value }}"
      - name: Generate release notes with git-chglog
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          go install github.com/git-chglog/git-chglog/cmd/git-chglog@v0.15.4
          "$(go env GOPATH)/bin/git-chglog" --output release-notes.md "v$VERSION"
          test -s release-notes.md || echo "Release $VERSION" > release-notes.md
      - name: Request PGYER upload credentials
        id: pgyer-token
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        run: |
          test -n "$PGYER_API_KEY"
          UPDATE_DESCRIPTION="$(<release-notes.md)"
          curl --fail-with-body --silent --show-error \
            --form "_api_key=$PGYER_API_KEY" \
            --form "buildType=android" \
            --form "buildInstallType=1" \
            --form "buildInstallDate=2" \
            --form "buildUpdateDescription=$UPDATE_DESCRIPTION" \
            https://www.pgyer.com/apiv2/app/getCOSToken > pgyer-token.json
          jq -e '.code == 0' pgyer-token.json
          echo "build_key=$(jq -r '.data.key' pgyer-token.json)" >> "$GITHUB_OUTPUT"
      - name: Upload APK to PGYER
        run: |
          ENDPOINT="$(jq -r '.data.endpoint' pgyer-token.json)"
          KEY="$(jq -r '.data.params.key' pgyer-token.json)"
          SIGNATURE="$(jq -r '.data.params.signature' pgyer-token.json)"
          SECURITY_TOKEN="$(jq -r '.data.params["x-cos-security-token"]' pgyer-token.json)"
          curl --fail-with-body --silent --show-error -X POST "$ENDPOINT" \
            --form-string "key=$KEY" \
            --form-string "signature=$SIGNATURE" \
            --form-string "x-cos-security-token=$SECURITY_TOKEN" \
            --form-string "x-cos-meta-file-name=app-release.apk" \
            --form "file=@app/build/outputs/apk/release/app-release.apk"
      - name: Wait for PGYER publication
        id: pgyer
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          BUILD_KEY: ${{ steps.pgyer-token.outputs.build_key }}
        run: |
          for attempt in {1..60}; do
            curl --fail-with-body --silent --show-error --get --data-urlencode "_api_key=$PGYER_API_KEY" --data-urlencode "buildKey=$BUILD_KEY" https://www.pgyer.com/apiv2/app/buildInfo > pgyer-build.json
            CODE="$(jq -r '.code' pgyer-build.json)"
            if [ "$CODE" = 0 ]; then
              echo "download_url=https://www.pgyer.com/$(jq -r '.data.buildShortcutUrl' pgyer-build.json)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$CODE" != 1246 ] && [ "$CODE" != 1247 ]; then jq . pgyer-build.json; exit 1; fi
            sleep 5
          done
          echo "Timed out waiting for PGYER publication" >&2
          exit 1
      - name: Notify Lark about the published build
        env:
          LARK_RELEASE_WEBHOOK: ${{ secrets.LARK_RELEASE_WEBHOOK }}
          VERSION: ${{ steps.version.outputs.value }}
          PGYER_URL: ${{ steps.pgyer.outputs.download_url }}
        run: |
          test -n "$LARK_RELEASE_WEBHOOK"
          jq -n --arg text "作业小伙伴 $VERSION 已发布并可安装\n下载地址：$PGYER_URL" \
            '{msg_type: "text", content: {text: $text}}' \
            | curl --fail-with-body --silent --show-error \
                -H "Content-Type: application/json" \
                --data-binary @- "$LARK_RELEASE_WEBHOOK"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          PGYER_URL: ${{ steps.pgyer.outputs.download_url }}
        run: |
          { cat release-notes.md; echo; echo "下载：$PGYER_URL"; } > github-release-notes.md
          gh release create "$VERSION" app/build/outputs/apk/release/app-release.apk --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file github-release-notes.md
      - name: Notify Lark about a failed release
        if: failure()
        env:
          LARK_RELEASE_WEBHOOK: ${{ secrets.LARK_RELEASE_WEBHOOK }}
          VERSION: ${{ steps.version.outputs.value }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$LARK_RELEASE_WEBHOOK"
          jq -n --arg text "cPrint $VERSION 发布失败\n查看日志：$RUN_URL" \
            '{msg_type: "text", content: {text: $text}}' \
            | curl --fail-with-body --silent --show-error \
                -H "Content-Type: application/json" \
                --data-binary @- "$LARK_RELEASE_WEBHOOK"
